name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------- API ----------
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: server
        run: npm run lint || true   # Server-Lint ist optional, ESLint teilt mit Frontend

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm run test:run

      - name: Build image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bma-lager-api:latest
            ghcr.io/${{ github.repository_owner }}/bma-lager-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set package visibility to public
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set +e
          for pkg in bma-lager-api; do
            for endpoint in \
              "https://api.github.com/repos/${OWNER}/${REPO}/packages/container/${pkg}" \
              "https://api.github.com/users/${OWNER}/packages/container/${pkg}" \
              "https://api.github.com/user/packages/container/${pkg}"; do
              echo "::group::PATCH ${endpoint}"
              status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -X PATCH \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${endpoint}" \
                -d '{"visibility":"public"}')
              echo "status=${status}"
              cat /tmp/resp.json; echo
              echo "::endgroup::"
              if [ "${status}" = "200" ]; then
                echo "visibility set to public via ${endpoint}"
                break
              fi
            done
          done

  # ---------- PWA ----------
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate version info
        run: npm run version:write

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Build image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pwa
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bma-lager-pwa:latest
            ghcr.io/${{ github.repository_owner }}/bma-lager-pwa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set package visibility to public
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set +e
          for pkg in bma-lager-pwa; do
            for endpoint in \
              "https://api.github.com/repos/${OWNER}/${REPO}/packages/container/${pkg}" \
              "https://api.github.com/users/${OWNER}/packages/container/${pkg}" \
              "https://api.github.com/user/packages/container/${pkg}"; do
              echo "::group::PATCH ${endpoint}"
              status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -X PATCH \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${endpoint}" \
                -d '{"visibility":"public"}')
              echo "status=${status}"
              cat /tmp/resp.json; echo
              echo "::endgroup::"
              if [ "${status}" = "200" ]; then
                echo "visibility set to public via ${endpoint}"
                break
              fi
            done
          done