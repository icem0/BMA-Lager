name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          # Kein manifest-file: das Repo ist ein einzelnes Package (PWA-Root
          # package.json). manifest-file ist nur fuer Monorepos gedacht und
          # loest hier sonst 'versionString.match is not a function' aus.
