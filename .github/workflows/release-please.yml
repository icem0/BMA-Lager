name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          # release-please v17+ ist im Manifest-Mode Default, sobald die Config
          # `packages` enthaelt. Wir sind ein einzelnes Package (Root-PWA), das
          # Manifest im Root (.release-please-manifest.json) reicht daher.
          # manifest-file explizit setzen ist optional, aber dokumentiert.
