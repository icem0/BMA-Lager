server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthz für Container-Healthcheck
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Service Worker darf nicht gecached werden (verhindert stale SW-Probleme)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    # Runtime-Config: vom Container-Entrypoint aus $VITE_API_URL generiert.
    # Darf nicht aus dem Browser-Cache kommen, sonst greift eine alte URL
    # nach einem Compose-Update.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # Reverse-Proxy zur API (Fastify). Damit ist nur EIN Host-Port noetig
    # (PWA_PORT) — die API wird ueber /api/ im selben Origin angesprochen.
    # Der 'api'-Service ist im Compose-Network 'internal' erreichbar.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }
    # Statische Assets (Hashed) — Cache-Forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Icons, PWA-Assets
    location ~* \.(png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA-Fallback: alles, was nicht als Datei existiert, geht auf index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}