server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthz für Container-Healthcheck
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Service Worker darf nicht gecached werden (verhindert stale SW-Probleme)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    # Runtime-Config: vom Container-Entrypoint aus $VITE_API_URL generiert.
    # Darf nicht aus dem Browser-Cache kommen, sonst greift eine alte URL
    # nach einem Compose-Update.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    # Manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }
    # Statische Assets (Hashed) — Cache-Forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Icons, PWA-Assets
    location ~* \.(png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA-Fallback: alles, was nicht als Datei existiert, geht auf index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}