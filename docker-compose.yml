# bma-lager Production Compose.
#
# Startet das komplette System:
#   - PostgreSQL (persistent via Volume pgdata)
#   - API (Fastify, Node 22)
#   - PWA (nginx)
#   - Caddy als Reverse-Proxy (TLS via Cloudflare Origin Cert oder Let's Encrypt)
#   - cloudflared als Cloudflare-Tunnel (externe Erreichbarkeit)
#
# Start:    docker compose up -d
# Update:   docker compose pull && docker compose up -d
# Logs:     docker compose logs -f api
#
# Voraussetzung: .env-Datei mit allen Werten (siehe .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bma}
      POSTGRES_USER: ${DB_USER:-bma}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bma} -d ${DB_NAME:-bma}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/bma-lager-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-bma}:${DB_PASSWORD}@db:5432/${DB_NAME:-bma}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FOTOS_DIR: /var/lib/bma-lager/fotos
      FOTOS_MAX_BYTES: ${FOTOS_MAX_BYTES:-524288}
      FOTOS_MAX_PER_ARTIKEL: ${FOTOS_MAX_PER_ARTIKEL:-5}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-1 minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
    volumes:
      - fotos-data:/var/lib/bma-lager/fotos
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  pwa:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/bma-lager-pwa:latest
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  # Migration + Bootstrap-Admin: einmaliger Job nach db-Start.
  # Wird per `docker compose run migrate` manuell ausgelöst (siehe README).
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/bma-lager-api:latest
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-bma}:${DB_PASSWORD}@db:5432/${DB_NAME:-bma}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint: ["node", "dist/db/migrate.js"]
    networks: [internal]
    restart: "no"

  bootstrap:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/bma-lager-api:latest
    profiles: ["bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${DB_USER:-bma}:${DB_PASSWORD}@db:5432/${DB_NAME:-bma}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint: ["node", "dist/cli/bootstrap-admin.js"]
    networks: [internal]
    restart: "no"

  # Reverse-Proxy (Caddy). Erhält vorab keine Ports am Host, weil der Cloudflare-
  # Tunnel der einzige Eingang ist. Falls du statt Tunnel einen eigenen
  # Reverse-Proxy nutzt, kommentiere die Ports-Zeile ein und entferne den
  # Cloudflare-Tunnel-Service.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pwa, api]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # ports:
    #   - "80:80"
    #   - "443:443"
    networks: [internal, external]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [external]

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  pgdata:
  fotos-data:
  caddy-data:
  caddy-config: