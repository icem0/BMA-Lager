# bma-lager Production Compose.
#
# Startet das System:
#   - PostgreSQL (persistent via Volume pgdata)
#   - API (Fastify, Node 22) — Port 3000
#   - PWA (nginx) — Port 8080
#
# KEIN Tunnel, KEIN Reverse-Proxy im Stack.
# Wenn du TLS / Domain brauchst, kümmerst du dich extern darum — z. B. mit
# nginx, Caddy, Traefik oder einem Cloud-Loadbalancer vor diesem Stack.
#
# Start:    docker compose up -d
# Update:   docker compose pull && docker compose up -d
# Logs:     docker compose logs -f api
#
# Voraussetzung: .env-Datei (siehe .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bma}
      POSTGRES_USER: ${DB_USER:-bma}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bma} -d ${DB_NAME:-bma}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    networks: [internal]

  api:
    image: ${BMA_IMAGE_REPO:-ghcr.io/icem0/bma-lager}-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-bma}:${DB_PASSWORD}@db:5432/${DB_NAME:-bma}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FOTOS_DIR: /var/lib/bma-lager/fotos
      FOTOS_MAX_BYTES: ${FOTOS_MAX_BYTES:-524288}
      FOTOS_MAX_PER_ARTIKEL: ${FOTOS_MAX_PER_ARTIKEL:-5}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-1 minute}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
    volumes:
      - fotos-data:/var/lib/bma-lager/fotos
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${API_PORT:-3000}:3000"
    networks: [internal]

  pwa:
    image: ${BMA_IMAGE_REPO:-ghcr.io/icem0/bma-lager}-pwa:latest
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${PWA_PORT:-8080}:80"
    networks: [internal]

  # Einmaliger Job: Migration ausfuehren.
  # Aufruf: docker compose --profile migrate up
  migrate:
    image: ${BMA_IMAGE_REPO:-ghcr.io/icem0/bma-lager}-api:latest
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-bma}:${DB_PASSWORD}@db:5432/${DB_NAME:-bma}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint: ["node", "dist/db/migrate.js"]
    networks: [internal]
    restart: "no"

  # Einmaliger Job: Initial-Admin aus .env anlegen.
  # Aufruf: docker compose --profile bootstrap up
  bootstrap:
    image: ${BMA_IMAGE_REPO:-ghcr.io/icem0/bma-lager}-api:latest
    profiles: ["bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${DB_USER:-bma}:${DB_PASSWORD}@db:5432/${DB_NAME:-bma}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint: ["node", "dist/cli/bootstrap-admin.js"]
    networks: [internal]
    restart: "no"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  fotos-data: